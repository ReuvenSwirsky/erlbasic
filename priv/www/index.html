<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erlang BASIC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #eee;
    }
    header {
      padding: 1rem 2rem;
      width: 100%;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.4rem; color: #00d4ff; letter-spacing: 0.05em; }
    header p  { font-size: 0.85rem; color: #aaa; }
    #terminal-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      width: 100%;
    }
    /* Outer box: takes up the post-scale layout space; sized by JS */
    #terminal-scale-outer {
      position: relative;
      overflow: hidden;
    }
    /* Inner wrapper: holds terminal + canvas at natural pixel size; JS applies CSS scale */
    #terminal-scale-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
    }
    #terminal {
      display: inline-block; /* shrink-to-fit xterm content */
      border: 1px solid #0f3460;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      position: relative;
      z-index: 2;
    }
    #graphics-canvas {
      position: absolute;
      top: 0;
      left: 0;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      /* CSS width/height matched to terminal pixel size by JS */
    }
    #terminal-container.graphics-mode #terminal {
      z-index: 1;
    }
    #terminal-container.graphics-mode #graphics-canvas {
      z-index: 3;
      opacity: 1;
      /* pointer-events: none lets keystrokes reach the terminal */
    }
    #status {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #888;
      text-align: right;
    }
    #status.connected { color: #4caf50; }
    #status.disconnected { color: #f44336; }
    /* Hide xterm scrollbar in HGR2 split-screen mode */
    #terminal-container.hgr2-mode .xterm-viewport {
      overflow-y: hidden !important;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #terminal-container.hgr2-mode .xterm-viewport::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>&#x1F5A5; Erlang BASIC</h1>
      <p>A time-shared BASIC interpreter — running live in Erlang</p>
    </div>
  </header>

  <div id="terminal-container">
    <!-- terminal-scale-outer takes up the scaled layout space (JS sets width/height) -->
    <div id="terminal-scale-outer">
      <!-- terminal-scale-wrapper holds content at natural size; CSS transform scales it -->
      <div id="terminal-scale-wrapper">
        <div id="terminal"></div>
        <canvas id="graphics-canvas" width="800" height="600"></canvas>
      </div>
    </div>
    <div id="status" class="disconnected">Connecting…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>

  <script>
    const term = new Terminal({
      cols: 80,
      rows: 25,
      cursorBlink: true,
      fontFamily: '"Cascadia Code", "Fira Code", "Courier New", monospace',
      fontSize: 16,
      theme: {
        background: '#000000',
        foreground: '#00ff41',
        cursor:     '#00ff41',
        black:      '#000000',
        brightBlack:'#555555',
      }
    });
    term.open(document.getElementById('terminal'));

    // ── Fixed 80×25 terminal with viewport-scaling ───────────────────────────
    // Strategy: xterm renders at its natural pixel size for 80×25 chars at
    // the chosen fontSize. We then CSS-transform the wrapper div to fill
    // the available viewport, keeping the exact 80×25 character grid.
    // The 800×600 graphics canvas gets its CSS size matched to the terminal
    // so it overlays precisely in both text and graphics mode.
    let naturalW = 0, naturalH = 0;

    function initLayout() {
      // Wait until xterm has rendered and sized the .xterm-screen element.
      const screen = term.element.querySelector('.xterm-screen');
      if (!screen || screen.offsetWidth === 0) {
        requestAnimationFrame(initLayout);
        return;
      }
      // Measure the terminal div (includes xterm content + 1px border each side).
      naturalW = term.element.offsetWidth;
      naturalH = term.element.offsetHeight;
      // Size the overlay canvas CSS to the exact same pixel footprint.
      // Internal resolution stays 800×600 for BASIC coordinate-space compatibility.
      canvas.style.width  = naturalW + 'px';
      canvas.style.height = naturalH + 'px';
      scaleToFit();
    }

    function scaleToFit() {
      if (!naturalW || !naturalH) return;
      const container = document.getElementById('terminal-container');
      const header    = document.querySelector('header');
      // Leave room for the status bar (~28 px) and container padding (2×16 px).
      const availW = container.clientWidth - 32;
      const availH = window.innerHeight - header.offsetHeight - 60;
      const scale  = Math.min(availW / naturalW, availH / naturalH);
      document.getElementById('terminal-scale-wrapper').style.transform =
        'scale(' + scale + ')';
      const outer = document.getElementById('terminal-scale-outer');
      outer.style.width  = Math.ceil(naturalW * scale) + 'px';
      outer.style.height = Math.ceil(naturalH * scale) + 'px';
    }

    requestAnimationFrame(initLayout);
    window.addEventListener('resize', scaleToFit);

    const statusEl = document.getElementById('status');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      statusEl.textContent = 'Connected';
      statusEl.className = 'connected';
    };

    ws.onclose = () => {
      stopAllSoundChannels();
      statusEl.textContent = 'Disconnected — reload to reconnect';
      statusEl.className = 'disconnected';
      term.writeln('\r\n\x1b[31mConnection closed.\x1b[0m');
    };

    ws.onerror = () => {
      statusEl.textContent = 'Connection error';
      statusEl.className = 'disconnected';
    };

    // Graphics setup
    const canvas = document.getElementById('graphics-canvas');
    const ctx = canvas.getContext('2d');
    
    // 16-color EGA/VGA palette (CSS strings for drawing, RGB triples for PGET matching)
    const palette = [
      '#000000', '#0000AA', '#00AA00', '#00AAAA',
      '#AA0000', '#AA00AA', '#AA5500', '#AAAAAA',
      '#555555', '#5555FF', '#55FF55', '#55FFFF',
      '#FF5555', '#FF55FF', '#FFFF55', '#FFFFFF'
    ];
    const paletteRgb = [
      [0,0,0],   [0,0,170],   [0,170,0],   [0,170,170],
      [170,0,0], [170,0,170], [170,85,0],  [170,170,170],
      [85,85,85],[85,85,255], [85,255,85], [85,255,255],
      [255,85,85],[255,85,255],[255,255,85],[255,255,255]
    ];
    function findPaletteColor(r, g, b) {
      for (let i = 0; i < paletteRgb.length; i++) {
        const [pr, pg, pb] = paletteRgb[i];
        if (r === pr && g === pg && b === pb) return i;
      }
      return -1;
    }
    
    let graphicsMode = 'none'; // 'none', 'hgr', 'hgr2'

    function handleGraphicsCommand(cmd) {
      const parts = cmd.split(':');
      const action = parts[0];

      // PGET pixel queries: always handle (respond to server even if graphics were reset)
      if (action === 'PGET') {
        const x = parseInt(parts[1]), y = parseInt(parts[2]);
        const data = ctx.getImageData(x, y, 1, 1).data;
        ws.send(findPaletteColor(data[0], data[1], data[2]).toString());
        return;
      }

      // Skip drawing commands when not in graphics mode (drains stale GFX frames
      // instantly after Ctrl-C resets graphicsMode, so BREAK text isn't delayed).
      if (graphicsMode === 'none' && action !== 'HGR' && action !== 'HGR2' && action !== 'TEXT') return;

      switch(action) {
        case 'HGR':
          graphicsMode = 'hgr';
          canvas.height = 600;
          canvas.style.height = naturalH + 'px';
          document.getElementById('terminal-container').classList.add('graphics-mode');
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 800, 600);
          break;

        case 'HGR2':
          graphicsMode = 'hgr2';
          // 480px internal height maps exactly to the 21-row CSS area; no black gap.
          canvas.height = 480;
          // Cover exactly 21 of 25 text rows; the bottom 4 rows remain visible as text area.
          canvas.style.height = Math.round(naturalH * 21 / 25) + 'px';
          document.getElementById('terminal-container').classList.add('graphics-mode');
          document.getElementById('terminal-container').classList.add('hgr2-mode');
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 800, 480);
          // Clear text rows 22-25, restrict scrolling to that region, move cursor there.
          term.write('\x1b[22;1H\x1b[2K\x1b[23;1H\x1b[2K\x1b[24;1H\x1b[2K\x1b[25;1H\x1b[2K\x1b[22;25r\x1b[22;1H');
          break;

        case 'TEXT':
          graphicsMode = 'none';
          canvas.height = 600;
          canvas.style.height = naturalH + 'px'; // restore if HGR2 shrank it
          document.getElementById('terminal-container').classList.remove('graphics-mode');
          document.getElementById('terminal-container').classList.remove('hgr2-mode');
          term.write('\x1b[r'); // reset scroll region if HGR2 set it
          break;

        case 'PSET': {
          const x = parseInt(parts[1]);
          const y = parseInt(parts[2]);
          const c = parseInt(parts[3]) & 15;
          ctx.fillStyle = palette[c];
          ctx.fillRect(x, y, 1, 1);
          break;
        }

        case 'LINE': {
          const x1 = parseInt(parts[1]);
          const y1 = parseInt(parts[2]);
          const x2 = parseInt(parts[3]);
          const y2 = parseInt(parts[4]);
          const lc = parseInt(parts[5]) & 15;
          ctx.strokeStyle = palette[lc];
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          break;
        }

        case 'RECT': {
          const rx1 = parseInt(parts[1]);
          const ry1 = parseInt(parts[2]);
          const rx2 = parseInt(parts[3]);
          const ry2 = parseInt(parts[4]);
          const rc  = parseInt(parts[5]) & 15;
          ctx.fillStyle = palette[rc];
          ctx.fillRect(rx1, ry1, rx2 - rx1 + 1, ry2 - ry1 + 1);
          break;
        }

        case 'CIRCLE': {
          const cx = parseInt(parts[1]);
          const cy = parseInt(parts[2]);
          const r  = parseInt(parts[3]);
          const cc = parseInt(parts[4]) & 15;
          ctx.strokeStyle = palette[cc];
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, 2 * Math.PI);
          ctx.stroke();
          break;
        }

        case 'GCLS':
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 800, graphicsMode === 'hgr2' ? 480 : 600);
          break;
      }
    }

    // Handle TXT: control frames (GETCHAR row/col queries from the server)
    function handleTextQuery(cmd) {
      const parts = cmd.split(':');
      if (parts[0] === 'GETCHAR') {
        const row = parseInt(parts[1]), col = parseInt(parts[2]);
        const line = term.buffer.active.getLine(row - 1);  // xterm is 0-indexed
        let code = 32;  // default: space for empty/unwritten cells
        if (line) {
          const cell = line.getCell(col - 1);
          if (cell) {
            const c = cell.getCode();
            code = c > 0 ? c : 32;
          }
        }
        ws.send(code.toString());
      }
    }

    // SOUND setup (4 Atari-like channels with pitch/distortion/volume)
    const soundChannels = [null, null, null, null];
    let audioCtx = null;
    let audioUnlockAttempted = false;

    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) {
          return null;
        }
        audioCtx = new Ctx();
      }
      return audioCtx;
    }

    function unlockAudioFromGesture() {
      if (audioUnlockAttempted) {
        return;
      }
      audioUnlockAttempted = true;
      const ctx = getAudioCtx();
      if (!ctx) {
        return;
      }
      if (ctx.state === 'suspended') {
        ctx.resume().catch(() => {
          audioUnlockAttempted = false;
        });
      }
    }

    function stopSoundChannel(channel) {
      const node = soundChannels[channel];
      if (!node) {
        return;
      }
      try { node.osc.stop(); } catch (_) {}
      try { node.osc.disconnect(); } catch (_) {}
      try { node.gain.disconnect(); } catch (_) {}
      soundChannels[channel] = null;
    }

    function stopAllSoundChannels() {
      for (let i = 0; i < soundChannels.length; i += 1) {
        stopSoundChannel(i);
      }
    }

    function mapDistortionToWave(distortion) {
      switch (distortion & 15) {
        case 10:
        case 12:
          return 'square';
        case 8:
          return 'triangle';
        case 14:
          return 'sawtooth';
        default:
          return 'sine';
      }
    }

    function atariPitchToHz(pitch) {
      const p = Math.max(0, Math.min(255, pitch));
      // SOUND pitch is a divisor: larger values mean lower notes.
      const hz = 36000 / (p + 2);
      return Math.max(32, Math.min(2500, hz));
    }

    function handleSoundCommand(cmd) {
      if (cmd === 'STOPALL') {
        stopAllSoundChannels();
        return;
      }
      const parts = cmd.split(':');
      if (parts.length !== 4) {
        return;
      }
      const channel = Math.max(0, Math.min(3, parseInt(parts[0], 10) || 0));
      const pitch = Math.max(0, Math.min(255, parseInt(parts[1], 10) || 0));
      const distortion = Math.max(0, Math.min(15, parseInt(parts[2], 10) || 0));
      const volume = Math.max(0, Math.min(15, parseInt(parts[3], 10) || 0));

      stopSoundChannel(channel);
      if (volume <= 0) {
        return;
      }

      const ctx = getAudioCtx();
      if (!ctx) {
        return;
      }

      if (ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = mapDistortionToWave(distortion);
      osc.frequency.value = atariPitchToHz(pitch);
      gain.gain.value = (volume / 15) * 0.08;

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();

      soundChannels[channel] = { osc, gain };
    }
    
    // Output from the server → display in terminal
    ws.onmessage = (evt) => {
      const data = evt.data;
      // Control frames start with STX (\x02) and are not displayed
      if (data.length > 0 && data.charCodeAt(0) === 2) {
        const cmd = data.slice(1);
        if (cmd === 'PASSWORD_ON')  { passwordMode = true; }
        if (cmd === 'PASSWORD_OFF') { passwordMode = false; }
        if (cmd === 'CHAR_MODE_ON')  { charMode = true; }
        if (cmd === 'CHAR_MODE_OFF') { charMode = false; inputBuffer = ''; }
        if (cmd.startsWith('GFX:')) { handleGraphicsCommand(cmd.slice(4)); }
        if (cmd.startsWith('SND:')) { handleSoundCommand(cmd.slice(4)); }
        if (cmd.startsWith('TXT:')) { handleTextQuery(cmd.slice(4)); }
        return;
      }
      // Normalise \r\n from BASIC to what xterm expects
      term.write(data.replace(/\r\n/g, '\r\n'));
    };

    // Keyboard input.
    // In normal mode: buffer until Enter, then send the whole line.
    // In char mode (GET/GETKEY): send each key immediately as a single character,
    // without echoing or waiting for Enter.
    let inputBuffer  = '';
    let passwordMode = false;
    let charMode     = false;
    term.onKey(({ key, domEvent }) => {
      const code = domEvent.keyCode;

      // Browsers may block Web Audio until a user gesture.
      unlockAudioFromGesture();

      // Ctrl-C to interrupt (always)
      if (domEvent.ctrlKey && code === 67) {
        term.write('^C');
        ws.send('\x03');
        stopAllSoundChannels();
        inputBuffer = '';
        // Exit graphics mode if active
        if (graphicsMode === 'hgr2') {
          canvas.height = 600;
          canvas.style.height = naturalH + 'px';
          term.write('\x1b[r');
          document.getElementById('terminal-container').classList.remove('hgr2-mode');
        } else if (graphicsMode === 'hgr') {
          canvas.height = 600;
          canvas.style.height = naturalH + 'px';
        }
        graphicsMode = 'none';
        document.getElementById('terminal-container').classList.remove('graphics-mode');
        return;
      }

      if (charMode) {
        // In char mode: send the raw character immediately, no echo, no buffering.
        if (key && key.length === 1) {
          ws.send(key + '\n');
        }
        return;
      }

      if (code === 13) {                          // Enter
        term.write('\r\n');
        ws.send(inputBuffer + '\n');
        inputBuffer = '';
      } else if (code === 8) {                    // Backspace
        if (inputBuffer.length > 0) {
          inputBuffer = inputBuffer.slice(0, -1);
          term.write('\b \b');
        }
      } else if (key >= ' ' || code === 9) {     // Printable / Tab
        inputBuffer += key;
        term.write(passwordMode ? '*' : key);
      }
    });

    // Also unlock on pointer/touch interaction in case keyboard isn't used first.
    window.addEventListener('pointerdown', unlockAudioFromGesture, { passive: true });
    window.addEventListener('touchstart', unlockAudioFromGesture, { passive: true });
  </script>
</body>
</html>
