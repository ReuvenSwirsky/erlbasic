services:
  erlbasic:
    build:
      context: .
      dockerfile: Dockerfile
    image: erlbasic:latest
    ports:
      - "5555:5555"
      - "8081:8081"
    volumes:
      - erlbasic_data:/data/erlbasic/users
      - ${CREDENTIALS_FILE:-./.credentials}:/run/secrets/credentials:ro
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - erlbasic
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_FILE:-./priv/ssl/cert.pem}:/run/secrets/tls-cert.pem:ro
      - ${TLS_KEY_FILE:-./priv/ssl/key.pem}:/run/secrets/tls-key.pem:ro
    restart: unless-stopped

volumes:
  erlbasic_data:
